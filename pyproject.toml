[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-vn100"
version = "0.1.0"
description = "Hệ thống định giá tự động VN100"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "vnstock",
    "gspread",
    "httpx",
    "pandas",
    "scipy",
    "psycopg2-binary",
    "pyyaml"
]

[tool.setuptools.packages.find]
include = ["valuation*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy"
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
